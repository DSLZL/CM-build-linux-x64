# Initialize runner temporary paths after the exact source checkout.
# Called only by this builder repository's reviewed build.yml.
# Omitting cache-mode here inherits the caller's explicit platform-enforced cap.
name: CM native Linux x64 recipe

on:
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      builder_repository:
        required: true
        type: string
      request_id:
        required: true
        type: string
      cache_epoch:
        required: true
        type: string
      cache_mode:
        required: true
        type: string
      consumer_required:
        required: true
        type: boolean
      build_kind:
        required: true
        type: string
      host_origin:
        required: false
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.linux-x64.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.linux-x64.outputs.artifact_digest }}
      input_artifact_id:
        value: ${{ jobs.linux-x64.outputs.input_artifact_id }}
      input_artifact_digest:
        value: ${{ jobs.linux-x64.outputs.input_artifact_digest }}
      production_origin:
        value: ${{ jobs.linux-x64.outputs.production_origin }}
      validation_artifact_id:
        value: ${{ jobs.linux-x64.outputs.validation_artifact_id }}
      validation_artifact_digest:
        value: ${{ jobs.linux-x64.outputs.validation_artifact_digest }}

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash
    working-directory: cm-source

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.reuse.outputs.artifact_id || steps.payload.outputs.artifact-id }}
      artifact_digest: ${{ steps.reuse.outputs.artifact_digest || steps.payload.outputs.artifact-digest }}
      input_artifact_id: ${{ steps.reuse.outputs.input_artifact_id || steps.runtime-inputs.outputs.artifact-id }}
      input_artifact_digest: ${{ steps.reuse.outputs.input_artifact_digest || steps.runtime-inputs.outputs.artifact-digest }}
      production_origin: ${{ steps.validation.outputs.production_origin }}
      validation_artifact_id: ${{ steps.validation-upload.outputs.artifact-id }}
      validation_artifact_digest: ${{ steps.validation-upload.outputs.artifact-digest }}
    env:
      CM_SOURCE_DIR: ${{ github.workspace }}/cm-source
      CM_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      CM_SOURCE_SHA: ${{ inputs.source_sha }}
      CM_BUILDER_REPOSITORY: ${{ inputs.builder_repository }}
      CM_EXECUTION_ROLE: platform_builder
      CM_REQUEST_ID: ${{ inputs.request_id }}
      CM_BUILD_KIND: ${{ inputs.build_kind }}
      CM_HOST_ORIGIN: ${{ inputs.host_origin }}
      CM_CACHE_MODE: ${{ inputs.cache_mode }}
      CM_CACHE_EPOCH: ${{ inputs.cache_epoch }}
      CM_CI_CONFIG: .github/cm-ci.json
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 8G
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}/cm-source
    steps:
      - name: Checkout trusted worker infrastructure at its exact workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .cm-worker
          persist-credentials: false
      - name: Checkout exact CM source from the sole source repository
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          path: cm-source
          fetch-depth: 0
          persist-credentials: false
      - name: Set runner temporary paths after source checkout
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cm-cargo-home"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cm-target"
            echo "SCCACHE_DIR=$RUNNER_TEMP/cm-sccache"
            echo "CM_HOST_BUILD_CACHE_DIR=$RUNNER_TEMP/cm-host-build-cache"
            echo "CM_ACCEPTANCE_BUILD_CACHE_DIR=$RUNNER_TEMP/cm-acceptance-build-cache"
            echo "CM_CI_LOG_DIR=$RUNNER_TEMP/cm-linux-x64-evidence"
            echo "CM_CI_ARTIFACT_DIR=$RUNNER_TEMP/cm-linux-x64-artifacts"
            echo "CM_CONSUMER_INPUT_DIR=$RUNNER_TEMP/cm-runtime-inputs"
            echo "CM_CONSUMER_TRANSFER_DIR=$RUNNER_TEMP/cm-runtime-transfer"
            echo "CM_VALIDATION_INPUT_DIR=$RUNNER_TEMP/cm-validation-inputs"
            echo "CM_WORKER_POLICY_DIR=$GITHUB_WORKSPACE/.cm-worker/.github/scripts"
          } >> "$GITHUB_ENV"
      - name: Verify source SHA and platform-enforced cache authority
        id: policy
        uses: ./.cm-worker/.github/actions/cache-authority
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
      - name: Record source identity separately from worker identity
        run: python3 -B "$GITHUB_WORKSPACE/.cm-worker/.github/scripts/record_run.py" "$CM_CI_LOG_DIR"
      - name: Reuse exact completed producer before installing or compiling
        id: reuse
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
        run: python3 -B "$GITHUB_WORKSPACE/.cm-worker/.github/scripts/retry.py" plan
      - name: Restore exact successful qualification without executing requested source
        if: inputs.build_kind == 'mod-only' && steps.reuse.outputs.reused != 'true'
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
        run: python3 -B "$GITHUB_WORKSPACE/.cm-worker/.github/scripts/worker_policy.py" restore-origin
      - name: Configure the independent Mod-only toolchain
        if: inputs.build_kind == 'mod-only' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/mod_author.py configure
      - name: Materialize exact upstream and the reviewed Host overlay
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/host.py prepare 2>&1 | tee "$CM_CI_LOG_DIR/host-prepare.log"
      - name: Require real current-task mappings
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/linux_ci.py configure 2>&1 | tee "$CM_CI_LOG_DIR/configure.log"
      - name: Check current independent case fingerprints before expensive work
        if: inputs.consumer_required && inputs.build_kind == 'qualification'
        run: |
          python3 -B ci/scripts/retry.py self-check
          python3 -B ci/scripts/turn_budget.py self-check
      - name: Restore the qualified legacy Host reference for metadata rejection
        if: inputs.consumer_required && inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
        run: python3 -B ci/scripts/turn_budget.py restore-legacy
      - name: Install exact reviewed Rust toolchain on the worker
        if: steps.reuse.outputs.reused != 'true'
        run: rustup toolchain install "$CM_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target "$CM_TARGET" 2>&1 | tee "$CM_CI_LOG_DIR/toolchain.log"
      - name: Enable upstream-required user namespaces on this ephemeral CI runner
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 | tee "$CM_CI_LOG_DIR/userns-setup.log"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 | tee -a "$CM_CI_LOG_DIR/userns-setup.log"
          fi
      - name: Install required Linux native dependencies
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev libssl-dev bubblewrap
          python3 -B ci/scripts/host.py native 2>&1 | tee "$CM_CI_LOG_DIR/native-inputs.log"
      - name: Install pinned sccache
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
          disable_annotations: true
      - name: Identify compatible cache namespace inside this builder repository
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: cache-identity
        run: python3 -B ci/scripts/linux_ci.py identity 2>&1 | tee "$CM_CI_LOG_DIR/cache-identity.log"
      - name: Restore this worker repository's Cargo downloads
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: ${{ steps.cache-identity.outputs.cargo_key }}
          restore-keys: ${{ steps.cache-identity.outputs.cargo_prefix }}
          enableCrossOsArchive: false
      - name: Restore this worker repository's sccache snapshot
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: sccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-identity.outputs.sccache_key }}
          restore-keys: |
            ${{ steps.cache-identity.outputs.sccache_prefix }}
            ${{ steps.cache-identity.outputs.sccache_legacy_prefix }}
          enableCrossOsArchive: false
      - name: Start sccache after restoring its worker-local snapshot
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: sccache-start
        run: |
          sccache --start-server 2>&1 | tee "$CM_CI_LOG_DIR/sccache-start.log"
          sccache --zero-stats
          sccache --show-stats --stats-format json > "$CM_CI_LOG_DIR/sccache-restored.json"
      - name: Fetch locked dependencies
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/linux_ci.py fetch
      - name: Build and bind the bundled sandbox helper before Host compilation
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: |
          python3 -B ci/scripts/host.py helper
          sccache --show-stats --stats-format json > "$CM_CI_LOG_DIR/sccache-after-helper.json"
      - name: Seal complete Host inputs and the compiled helper digest
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: host-identity
        run: python3 -B ci/scripts/host.py seal 2>&1 | tee "$CM_CI_LOG_DIR/host-seal.log"
      - name: Check consumer observer before Host compilation
        if: inputs.consumer_required && inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/runtime_consumer.py self-check
      - name: Check Host canonicalization and rejection before compiling
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B fixtures/host-baseline/test_identity.py 2>&1 | tee "$CM_CI_LOG_DIR/host-identity-tests.log"
      - name: Seal exact acceptance compilation inputs and recipes
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: acceptance-identity
        run: |
          python3 -B ci/scripts/acceptance_cache.py self-check
          python3 -B ci/scripts/acceptance_cache.py identity
      - name: Restore linked acceptance executables and original build checks
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: acceptance-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CM_ACCEPTANCE_BUILD_CACHE_DIR }}
          key: ${{ steps.acceptance-identity.outputs.acceptance_key }}
          enableCrossOsArchive: false
      - name: Verify acceptance executable bytes inputs and original producer
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/acceptance_cache.py restore
      - name: Restore exact product-input Host binaries and original build evidence
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        id: host-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CM_HOST_BUILD_CACHE_DIR }}
          key: ${{ steps.host-identity.outputs.host_key }}
          enableCrossOsArchive: false
      - name: Verify restored Host bytes identity and original producer
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/host.py cache-restore
      - name: Check test and build only mapped current-task packages
        id: host-quality
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: |
          python3 -B ci/scripts/linux_ci.py build-test
          sccache --show-stats --stats-format json > "$CM_CI_LOG_DIR/sccache-after-host.json"
      - name: Run actual acceptance for the current mapped task
        if: inputs.build_kind == 'qualification' && steps.reuse.outputs.reused != 'true'
        run: python3 -B ci/scripts/linux_ci.py acceptance
      - name: Build only the current author Mod with actual compiler execution evidence
        if: inputs.build_kind == 'mod-only' && steps.reuse.outputs.reused != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential strace
          status=0
          strace -f -qq -s 16384 -e trace=execve,execveat -o "$CM_CI_LOG_DIR/m05-author-exec.log" python3 -B ci/scripts/mod_author.py produce || status=$?
          CM_AUTHOR_BUILD_EXIT="$status" python3 -B ci/scripts/mod_author.py audit-mod-only
      - name: Verify complete acceptance compilation snapshot
        id: acceptance-cache-prepare
        if: ${{ !cancelled() && inputs.build_kind == 'qualification' && steps.host-quality.outcome == 'success' }}
        run: python3 -B ci/scripts/acceptance_cache.py save
      - name: Prepare a verified Host snapshot from its successful producer baseline
        id: host-cache-prepare
        if: ${{ !cancelled() && inputs.build_kind == 'qualification' && inputs.cache_mode == 'write' && steps.host-quality.outcome == 'success' && steps.host-cache.outputs.cache-hit != 'true' }}
        run: python3 -B ci/scripts/host.py cache-save
      - name: Capture compiler statistics and stop before archiving
        id: cache-stop
        if: ${{ always() && steps.sccache-start.outcome == 'success' }}
        run: |
          set +e
          sccache --show-stats > "$CM_CI_LOG_DIR/sccache-stats.txt" 2> "$CM_CI_LOG_DIR/sccache-stats.stderr"
          stats_status=$?
          sccache --show-stats --stats-format json > "$CM_CI_LOG_DIR/sccache-stats.json" 2> "$CM_CI_LOG_DIR/sccache-stats-json.stderr"
          json_status=$?
          sccache --stop-server > "$CM_CI_LOG_DIR/sccache-stop.log" 2>&1
          stop_status=$?
          cat "$CM_CI_LOG_DIR/sccache-stats.txt"
          if (( stats_status != 0 || json_status != 0 || stop_status != 0 )); then exit 1; fi
      - name: Record final identity and cache observations
        if: ${{ always() && steps.policy.outcome == 'success' }}
        env:
          CM_JOB_STATUS: ${{ job.status }}
          CM_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CM_CARGO_CACHE_MATCH: ${{ steps.cargo-cache.outputs.cache-matched-key }}
          CM_SCCACHE_ARCHIVE_HIT: ${{ steps.sccache-cache.outputs.cache-hit }}
          CM_SCCACHE_ARCHIVE_MATCH: ${{ steps.sccache-cache.outputs.cache-matched-key }}
        run: python3 -B "$GITHUB_WORKSPACE/.cm-worker/.github/scripts/record_run.py" "$CM_CI_LOG_DIR"
      - name: Upload actual current-task artifacts
        id: payload
        if: ${{ success() && steps.reuse.outputs.reused != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-linux-x64-task-artifacts-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact frozen runtime inputs for the separate consumer
        id: runtime-inputs
        if: ${{ success() && inputs.consumer_required && steps.reuse.outputs.reused != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-linux-x64-runtime-inputs-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CONSUMER_TRANSFER_DIR }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Prepare current tests separately from the original frozen product
        if: inputs.consumer_required
        id: validation
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
          CM_CURRENT_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          CM_CURRENT_INPUT_ARTIFACT_ID: ${{ steps.runtime-inputs.outputs.artifact-id }}
        run: python3 -B ci/scripts/retry.py overlay
      - name: Upload only current runtime tests and exact origin references
        if: inputs.consumer_required
        id: validation-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-linux-x64-validation-inputs-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_VALIDATION_INPUT_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Save successful trusted source Cargo downloads
        if: ${{ success() && steps.reuse.outputs.reused != 'true' && inputs.build_kind == 'qualification' && inputs.cache_mode == 'write' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: ${{ steps.cache-identity.outputs.cargo_key }}
          enableCrossOsArchive: false
      - name: Save successful trusted source compiler snapshot
        if: ${{ success() && inputs.build_kind == 'qualification' && inputs.cache_mode == 'write' && steps.cache-stop.outcome == 'success' && steps.sccache-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-identity.outputs.sccache_key }}
          enableCrossOsArchive: false
      - name: Save successful trusted source Host binaries and original build checks
        if: ${{ !cancelled() && inputs.build_kind == 'qualification' && inputs.cache_mode == 'write' && steps.host-cache-prepare.outcome == 'success' && steps.host-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CM_HOST_BUILD_CACHE_DIR }}
          key: ${{ steps.host-identity.outputs.host_key }}
          enableCrossOsArchive: false
      - name: Save linked acceptance executables without runtime results
        if: ${{ !cancelled() && inputs.build_kind == 'qualification' && inputs.cache_mode == 'write' && steps.acceptance-cache-prepare.outcome == 'success' && steps.acceptance-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CM_ACCEPTANCE_BUILD_CACHE_DIR }}
          key: ${{ steps.acceptance-identity.outputs.acceptance_key }}
          enableCrossOsArchive: false
      - name: Upload logs compiler statistics and source/worker identities
        if: ${{ always() && steps.policy.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-linux-x64-evidence-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CI_LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
